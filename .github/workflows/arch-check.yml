name: Architecture Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  arch-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & ArchCheck
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Architecture Analysis
        run: |
          archcheck analyze tests/fixtures/simple_project -o report.html

      - name: Run Architecture Rules Check
        run: |
          archcheck check tests/fixtures/simple_project --config examples/archrules.yaml