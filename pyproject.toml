[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "archcheck"
version = "0.1.0"
description = "A lightweight Python architecture linter and dependency graph generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "typer>=0.9.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pyvis>=0.3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
ai = [
    "google-genai",
]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.scripts]
archcheck = "archcheck.cli:main"